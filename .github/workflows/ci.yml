name: ci
on:
  pull_request:
  push:
    branches-ignore: [main]   # main is built/deployed by daily.yml
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests_app
      - run: python -m pytest tests_app -q
      - run: pip install -r requirements.txt && python -m unittest discover tests   # legacy static-site tool
