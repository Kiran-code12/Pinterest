name: daily-pins
on:
  schedule: [{cron: "30 3 * * *"}]   # 09:00 IST
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pinbot build && python3 -m pinbot queue
      # Only posts live once the API secrets exist; otherwise dry-run.
      - run: |
          if [ -n "$PINTEREST_ACCESS_TOKEN" ]; then python3 -m pinbot publish --limit 3 --live --delay 3600; else python3 -m pinbot publish --limit 3; fi
      - run: |
          git config user.name "pinbot"; git config user.email "pinbot@users.noreply.github.com"
          git add -f docs data/queue.json; git commit -m "daily update" || true; git push
